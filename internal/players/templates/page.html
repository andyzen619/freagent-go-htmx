{{define "content"}}
<div>
  <h2>Free agents</h2>
  <div>
    <a href="/players" hx-get="/hx/players/rows" hx-target="#player-rows" hx-push-url="/players">All</a>
    <a href="/players?pos=PG" hx-get="/hx/players/rows?pos=PG" hx-target="#player-rows" hx-push-url="/players?pos=PG">PG</a>
    <a href="/players?pos=SG" hx-get="/hx/players/rows?pos=SG" hx-target="#player-rows" hx-push-url="/players?pos=SG">SG</a>
    <a href="/players?pos=SF" hx-get="/hx/players/rows?pos=SF" hx-target="#player-rows" hx-push-url="/players?pos=SF">SF</a>
    <a href="/players?pos=PF" hx-get="/hx/players/rows?pos=PF" hx-target="#player-rows" hx-push-url="/players?pos=PF">PF</a>
    <a href="/players?pos=C" hx-get="/hx/players/rows?pos=C" hx-target="#player-rows" hx-push-url="/players?pos=C">C</a>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr><th>Player</th><th>Pos</th><th>Team</th></tr>
      </thead>
      <tbody id="player-rows">{{template "rows" .}}</tbody>
    </table>
  </div>
</div>
{{end}}
