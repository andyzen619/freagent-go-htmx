<!doctype html>
<html lang="en">
  <head>
    <title>Fantasy waiver Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/daisyui@latest"></script>
  </head>
  <body class="bg-base-200 p-6">
    <div class="card w-96 bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title">Fantasy waiver Assistant</h2>
        {{if .LoggedIn}}
        <p>Logged in with Yahoo</p>
        {{else}}
        <a class="btn btn-primary" href="/login">Login with Yahoo</a>
        {{end}}
      </div>
    </div>
  </body>
</html>
