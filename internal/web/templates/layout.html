{{define "layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fantasy Waiver Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { max-width: 720px; margin: 0 auto; padding: 12px; background: #fff; color: #111;
             font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .nav { margin-bottom: 16px; }
      .brand { display: block; margin-bottom: 6px; font-weight: 700; }
      .tabs { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid #e5e7eb;
              font-size: 12px; }
      .tabs a { padding: 10px 2px; margin-bottom: -1px; border-bottom: 2px solid transparent;
                color: #6b7280; text-decoration: none; }
      .tabs a.on { color: #111; border-color: #111; font-weight: 600; }
      .page-title { margin: 0 0 10px; font-size: 15px; font-weight: 600; text-transform: uppercase;
                    letter-spacing: .04em; color: #475569; }
      .mock-data { margin-bottom: 10px; padding: 8px 10px; border: 1px solid #bfdbfe;
                   border-radius: 7px; background: #eff6ff; color: #1e40af; font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }      .chips a { padding: 4px 9px; border: 1px solid #e5e7eb; border-radius: 999px;
                 font-size: 11px; color: #374151; text-decoration: none; }
      .chips a.on { background: #111; border-color: #111; color: #fff; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { padding: 6px 0; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 11px;
           font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
      td { padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
      tbody tr:nth-child(even) { background: #fafafa; }
      .status { display: inline-flex; align-items: center; gap: 6px; color: #374151; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
      .status-warn .status-dot { background: #d97706; }
      .auth-error { padding: 14px; border: 1px solid #f3d59a; border-radius: 10px;
                    background: #fffbeb; }
      .auth-error-heading { display: flex; align-items: flex-start; gap: 10px; }
      .auth-error-icon { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px; color: #b45309; }
      .auth-error h3 { margin: 0; font-size: 14px; line-height: 1.35; color: #92400e; }
      .auth-error-lead { margin: 4px 0 0; color: #57534e; }
      .auth-steps { margin: 12px 0 14px; padding-left: 20px; color: #57534e; }
      .auth-steps li + li { margin-top: 4px; }
      .auth-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .auth-button { display: inline-flex; align-items: center; justify-content: center;
                     min-height: 44px; padding: 0 12px; border: 1px solid #111; border-radius: 6px;
                     background: #111; color: #fff; font-weight: 600; text-decoration: none; }
      .auth-button.secondary { background: #fff; color: #111; }
      .auth-details { margin-top: 14px; border-top: 1px solid #f3d59a; }
      .auth-details summary { min-height: 44px; padding: 12px 0 6px; cursor: pointer;
                              color: #78716c; font-size: 12px; }
      .auth-details pre { margin: 4px 0 0; padding: 9px; overflow-x: auto; border-radius: 5px;
                          background: #f5f5f4; color: #44403c; font-size: 11px; line-height: 1.45;
                          white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 24rem) {
        .auth-actions { flex-direction: column; }
        .auth-button { width: 100%; }
      }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.11"></script>
  </head>
  <body>
    <nav class="nav">
      <a class="brand" href="/">Fantasy Waiver Assistant</a>
      <div class="tabs">
        <a class="{{if and .Nav (eq .Nav "home")}}on{{end}}" href="/"
           {{if and .Nav (eq .Nav "home")}}aria-current="page"{{end}}>Home</a>
        <a class="{{if and .Nav (eq .Nav "players")}}on{{end}}" href="/players"
           {{if and .Nav (eq .Nav "players")}}aria-current="page"{{end}}>Free agents</a>
      </div>
    </nav>
    <main>{{template "content" .}}</main>
  </body>
</html>{{end}}
