{{define "layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fantasy Waiver Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { max-width: 720px; margin: 0 auto; padding: 12px; background: #fff; color: #111;
             font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .nav { margin-bottom: 16px; }
      .brand { display: block; margin-bottom: 6px; font-weight: 700; }
      .tabs { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid #e5e7eb;
              font-size: 12px; }
      .tabs a { padding: 10px 2px; margin-bottom: -1px; border-bottom: 2px solid transparent;
                color: #6b7280; text-decoration: none; }
      .tabs a.on { color: #111; border-color: #111; font-weight: 600; }
      .page-title { margin: 0 0 10px; font-size: 15px; font-weight: 600; text-transform: uppercase;
                    letter-spacing: .04em; color: #475569; }
      .mock-data { margin-bottom: 10px; padding: 8px 10px; border: 1px solid #bfdbfe;
                   border-radius: 7px; background: #eff6ff; color: #1e40af; font-size: 12px; }
      .sort-controls { display: grid; gap: 6px; margin-bottom: 10px; }
      .sort-row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) 44px;
                   align-items: center; gap: 6px; }
      .sort-level { color: #6b7280; font-size: 10px; font-weight: 700;
                    text-transform: uppercase; }
      .sort-select { width: 100%; min-height: 44px; padding: 0 28px 0 8px;
                     border: 1px solid #cbd5e1; border-radius: 6px; background: #fff;
                     color: #374151; font: inherit; font-size: 12px; font-weight: 600; }
      .sort-select:disabled { background: #f8fafc; color: #9ca3af; }
      .sort-dir { display: inline-flex; align-items: center; justify-content: center;
                   width: 44px; height: 44px; border: 1px solid #cbd5e1; border-radius: 6px;
                   background: #fff; color: #111; font-size: 17px; font-weight: 700;
                   text-decoration: none; }
      .sort-dir.disabled { background: #f8fafc; color: #9ca3af; }
      .heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
                     margin: 0 0 10px; color: #6b7280; font-size: 10px; }
      .heat-swatch { width: 12px; height: 12px; border-radius: 3px;
                     box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%); }
      .heat-missing-note { margin-left: 4px; }
      .player-list { border-top: 1px solid #e5e7eb; }
      .player-row { padding: 10px 2px 11px; border-bottom: 1px solid #e5e7eb; }
      .player-identity { display: flex; align-items: baseline; justify-content: space-between;
                         gap: 8px; }
      .player-name { min-width: 0; margin: 0; overflow: hidden; font-size: 13px; line-height: 1.3;
                     text-overflow: ellipsis; white-space: nowrap; }
      .player-meta { flex: 0 0 auto; margin: 0; color: #6b7280; font-size: 11px; white-space: nowrap; }
      .player-stats { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 2px;
                      margin: 7px 0 0; text-align: center; }
      .player-stat { min-width: 0; padding: 3px 1px 4px; border-radius: 3px; }
      .player-stat dt { color: inherit; font-size: 8px; font-weight: 600; line-height: 1.2;
                        opacity: .72; text-transform: uppercase; white-space: nowrap; }
      .player-stat abbr { text-decoration: none; }
      .player-stat dd { margin: 2px 0 0; color: inherit; font-size: 11px;
                        font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
      .heat-1 { background: #fecaca; color: #7f1d1d; }
      .heat-2 { background: #fed7aa; color: #7c2d12; }
      .heat-3 { background: #fef3c7; color: #713f12; }
      .heat-4 { background: #bbf7d0; color: #14532d; }
      .heat-5 { background: #16a34a; color: #fff; }
      .heat-missing { background: #e5e7eb; color: #6b7280; }
      .players-message { margin: 0; padding: 12px 2px; color: #6b7280; }
      .players-error { color: #b91c1c; }
      @media (min-width: 520px) {
        .player-row { padding: 12px 2px; }
        .player-name { font-size: 14px; }
        .player-stat dt { font-size: 10px; }
        .player-stat dd { font-size: 12px; }
      }
      .status { display: inline-flex; align-items: center; gap: 6px; color: #374151; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
      .status-warn .status-dot { background: #d97706; }
      .auth-error { padding: 14px; border: 1px solid #f3d59a; border-radius: 10px;
                    background: #fffbeb; }
      .auth-error-heading { display: flex; align-items: flex-start; gap: 10px; }
      .auth-error-icon { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px; color: #b45309; }
      .auth-error h3 { margin: 0; font-size: 14px; line-height: 1.35; color: #92400e; }
      .auth-error-lead { margin: 4px 0 0; color: #57534e; }
      .auth-steps { margin: 12px 0 14px; padding-left: 20px; color: #57534e; }
      .auth-steps li + li { margin-top: 4px; }
      .auth-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .auth-button { display: inline-flex; align-items: center; justify-content: center;
                     min-height: 44px; padding: 0 12px; border: 1px solid #111; border-radius: 6px;
                     background: #111; color: #fff; font-weight: 600; text-decoration: none; }
      .auth-button.secondary { background: #fff; color: #111; }
      .auth-details { margin-top: 14px; border-top: 1px solid #f3d59a; }
      .auth-details summary { min-height: 44px; padding: 12px 0 6px; cursor: pointer;
                              color: #78716c; font-size: 12px; }
      .auth-details pre { margin: 4px 0 0; padding: 9px; overflow-x: auto; border-radius: 5px;
                          background: #f5f5f4; color: #44403c; font-size: 11px; line-height: 1.45;
                          white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 24rem) {
        .auth-actions { flex-direction: column; }
        .auth-button { width: 100%; }
      }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.11"></script>
  </head>
  <body>
    <nav class="nav">
      <a class="brand" href="/">Fantasy Waiver Assistant</a>
      <div class="tabs">
        <a class="{{if and .Nav (eq .Nav "home")}}on{{end}}" href="/"
           {{if and .Nav (eq .Nav "home")}}aria-current="page"{{end}}>Home</a>
        <a class="{{if and .Nav (eq .Nav "players")}}on{{end}}" href="/players"
           {{if and .Nav (eq .Nav "players")}}aria-current="page"{{end}}>Free agents</a>
      </div>
    </nav>
    <main>{{template "content" .}}</main>
  </body>
</html>{{end}}
